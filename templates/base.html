<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IB4 CD{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <h1>IB4 CD</h1>
            </div>
            <ul class="nav-menu">
                <li>
                    <a href="{{ url_for('wallets') }}" class="nav-icon {% if request.endpoint == 'wallets' %}active{% endif %}" title="Wallets">
                        <img src="/static/ico/wallet-money.svg" alt="Wallets">
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('address_book') }}" class="nav-icon {% if request.endpoint == 'address_book' %}active{% endif %}" title="Address Book">
                        <img src="/static/ico/vote.svg" alt="Address Book">
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('aml_check') }}" class="nav-icon {% if request.endpoint == 'aml_check' %}active{% endif %}" title="AML Check">
                        <img src="/static/ico/shield-up.svg" alt="AML Check">
                    </a>
                </li>
            </ul>
            <ul class="nav-menu" style="margin-top: auto;">
                <li>
                    <a href="{{ url_for('logout') }}" class="nav-icon" title="Выйти">
                        <img src="/static/ico/withdraw.svg" alt="Выйти">
                    </a>
                </li>
            </ul>
        </nav>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        window.fetch = ((nativeFetch) => (input, init = {}) => {
            const method = (init.method || 'GET').toUpperCase();
            const url = typeof input === 'string' ? input : input.url;
            const isSameOrigin = !/^https?:\/\//i.test(url) || url.startsWith(window.location.origin);
            if (isSameOrigin && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                init.headers = {
                    'X-Requested-With': 'XMLHttpRequest',
                    ...(init.headers || {})
                };
            }
            return nativeFetch(input, init);
        })(window.fetch);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
