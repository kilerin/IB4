{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>AML Check</h1>
    <p>Perform AML checks on addresses</p>
</div>

<div class="card" style="border: none; box-shadow: none;">
    <div style="padding: 20px;">
        <form id="amlCheckForm" style="display: flex; gap: 12px; align-items: flex-end;">
            <div style="flex: 1;">
                <label class="form-label">TRX Address</label>
                <input type="text" class="form-input" id="checkAddress" placeholder="T..." required style="font-family: 'Courier New', monospace;">
            </div>
            <button type="submit" class="btn btn-primary" id="checkButton">Check</button>
        </form>
        <div id="checkLoading" style="display: none; margin-top: 16px;">
            <div class="loading-spinner" style="display: inline-block; margin-right: 8px;"></div>
            <span>Выполняется проверка...</span>
        </div>
    </div>
</div>

<div class="card" style="margin-top: 20px; border: none; box-shadow: none;">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Risk Level</th>
                    <th>Risk Score</th>
                    <th>Address</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Manager</th>
                </tr>
            </thead>
            <tbody id="amlChecksTable">
                <!-- Results will be loaded here -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/aml_check.js') }}"></script>
{% endblock %}
