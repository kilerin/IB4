{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Address Book</h1>
    <p>Manage customer addresses and AML status</p>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Addresses</h2>
        <div class="controls">
            <button class="btn btn-sm" onclick="openAddAddressModal()">+ Add Address</button>
        </div>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>CUSTOMER</th>
                    <th>ADDRESS</th>
                    <th>AML</th>
                    <th>MANAGER</th>
                    <th>DATE ADDED</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="addressTable">
                <!-- Addresses will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Address Modal -->
<div id="addressModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="addressModalTitle">Add Address</h2>
        </div>
        <form id="addressForm" onsubmit="saveAddress(event)">
            <div class="form-group">
                <label class="form-label">Customer</label>
                <input type="text" class="form-input" id="addressCustomer" required>
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" class="form-input" id="addressAddress" placeholder="T..." required>
            </div>
            <div class="form-group">
                <label class="form-label">Manager</label>
                <input type="text" class="form-input" id="addressManager">
            </div>
            <div class="form-group">
                <label class="form-label">AML Status</label>
                <select class="form-input" id="addressAmlStatus">
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeAddressModal()">Cancel</button>
                <button type="submit" class="btn" id="addressSubmitBtn">Add</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/address_book.js') }}"></script>
{% endblock %}
