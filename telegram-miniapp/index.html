<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IB4DECK Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">IB4DECK</p>
        <h1 id="screenTitle">Wallets</h1>
      </div>
      <button class="ghost-btn" id="reloadBtn" type="button">Reload</button>
    </header>

    <section id="authState" class="state-card">Connecting to Telegram...</section>

    <main>
      <section class="screen active" id="walletsScreen"></section>
      <section class="screen" id="addressBookScreen"></section>
      <section class="screen" id="amlScreen"></section>
    </main>

    <nav class="bottom-tabs" aria-label="Mini App navigation">
      <button class="tab active" data-screen="wallets" type="button">Wallets</button>
      <button class="tab" data-screen="addressBook" type="button">Address Book</button>
      <button class="tab" data-screen="aml" type="button">AML</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-live="polite" hidden></section>

  <script src="./app.js"></script>
</body>
</html>
